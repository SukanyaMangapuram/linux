name: Linux-Practice

on:
  workflow_dispatch:
  
jobs:
  show-tree:
    name: Show-Tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install tree Command
        run: sudo apt-get update && sudo apt-get install -y tree
   
      - name: Show Root Folder Structure
        run: | 
          echo "Root Folder Structure"
          tree
  
  run-sample.log:
    name: Operations on Sample.log
    runs-on: ubutu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find the Count of 404
        run: |
          echo "===The occurances of 404==="
          grep 404 logs/sample.log
          echo "===Number of occurances of 404==="
          grep 404 logs/sample.log | wc -l
      
      - name: Working on with the IP Address
        run: |
          cd logs/
          head -5 sample.log
          echo "===Obtain the IPs from Sample.log"
          awk '{ print $1 }' sample.log
          echo "===obtain the count of entries===doesnot work as ot sorted"
          awk '{ print $1}' sample.log | uniq -c
          echo "Sort them in reverse (descending order)"
          awk '{ print $1 }' sample.log | sort | uniq -c | sort -nr
          echo "===List the duplicate entries==="
          sort sample.log | uniq -d | awk '{ print $1 }'

