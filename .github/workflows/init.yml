name: Initial Setup

on:
  workflow_dispatch:
  
  push: 
    bracnhes: [ main ]

jobs:
  os-version:
    name: OS Version Check
    runs-on: ubuntu-latest

    steps:
      - name: Linux Operating System
        run: |
          echo "Runner OS"
          cat /etc/os-release

      - name: Linux Kernel Version
        run: |
          echo "Runner Kernel Version"
          uname -r

      - name: User Details
        run: |
          echo "Username"
          whoami

  Create-Directory:
    name: Creating Training Directories
    runs-on: ubuntu-latest

    steps:
      - name: Creating Parent Directory        
        run: |
          mkdir -p ~/linux-training
          echo "-p is to not to show error is dierctory already exists"
          echo " ~ - root path"
          
      - name: Creating module directories
        run: |
          cd ~/linux-training
          mkdir module-01
          mkdir module-02
          mkdir module-03
          
          echo "Testing"
          echo "path"
          pwd
          echo "list of created directories"
          ls -l
          
  Linux-Environmet:
    name: Linux Enivironmennt
    runs-on: ubuntu-latest
    
    steps:
      - name: Linux Environment Check
        run: |
          echo "Shows UserID and group Memebership"
          echo "id: $(id)"
          

          echo "Available Memory"
          echo "free -h: $(free -h)"
          

          echo "Disk Space"
          echo "df -h: $(df -h)"
          

          echo "Network Inteface and Ip address"
          echo "ip addr: $(ip addr)"
          

          echo "Machine's Hostname"
          echo "hostname: $(hostname)"
          
  File-System-Navigation:
    name: File-System-Navigation
    runs-on: ubuntu-latest

    steps:
      - name: pwd,cd,ls
        run: |
          cd ~/linux-training
          echo "pwd-Print Working Directory"
          echo "pwd: $(pwd)"

          echo "ls-List Directory Contents"
          ls

          echo "ls -l: Detailed listing"
          ls -l

          echo "ls -a: Show hidden file"
          ls -a

          echo "ls -lh Human readable file sizes"
          ls -lh

          echo "ls -ltr Detailed Listing with time of adding in reverse order"
          ls -ltr


